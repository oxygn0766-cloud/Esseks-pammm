<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seni Çok Seviyorum ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* DAHA CANLI MAVİ ARKA PLAN */
            background: linear-gradient(135deg, #007bff 0%, #00c6ff 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        /* Uçuşan Semboller */
        .particle {
            position: absolute;
            top: -50px;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* Kart Konteyner */
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            max-width: 450px; /* Biraz daha genişlettim */
            width: 90%;
            z-index: 10;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            line-height: 1.3;
        }

        /* Şifre Ekranı */
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            outline: none;
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 15px;
            letter-spacing: 4px;
        }

        button {
            background: #ffffff;
            color: #1e3c72;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: scale(1.05);
            background: #f0f0f0;
        }

        /* Buton Alanı */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            position: relative;
            min-height: 60px;
        }

        #btn-no {
            position: absolute;
            background: #ff4d4d;
            color: white;
            transition: all 0.1s ease; /* Kaçma hızını artırdım */
        }

        #btn-yes {
            background: #4caf50;
            color: white;
        }

        .error-msg {
            color: #ff8080;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }

        .hidden {
            display: none !important;
        }

        .repost-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 15px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- Şifre Ekranı -->
    <div class="card" id="password-card">
        <h2>Gizli Alan 🤍</h2>
        <p style="margin-bottom: 15px; font-size: 0.9rem;">Devam etmek için şifreyi gir:</p>
        <input type="password" id="password-input" placeholder="••••••" maxlength="6">
        <br>
        <button onclick="checkPassword()">Giriş Yap</button>
        <div class="error-msg" id="error-msg">Hatalı şifre! Tekrar dene.</div>
    </div>

    <!-- Soru Ekranı -->
    <div class="card hidden" id="main-card">
        <!-- GÜNCELLENEN BAŞLIK -->
        <h2 id="main-title">güzelim eşşeklik ettim beni affet nolur😭😭</h2>
        <div class="btn-container" id="action-buttons">
            <button id="btn-yes" onclick="acceptApology()">Evet</button>
            <button id="btn-no">Hayır</button>
        </div>
        <div class="hidden" id="success-section">
            <!-- GÜNCELLENEN EVET MESAJLARI -->
            <p style="font-size: 1.2rem; margin-bottom: 15px;">yaaa eşşşek sıpam benimm🤍🤍🤍</p>
            <p class="repost-text">repostlarıma bak güzelimmm 📱</p>
        </div>
    </div>

    <script>
        // Arka Plan Efektleri (Uçuşan Beyaz Gül ve Beyaz Kalpler)
        const symbols = ['🌹', '🤍', '🌸'];
        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDuration = Math.random() * 3 + 4 + 's';
            particle.style.fontSize = Math.random() * 15 + 15 + 'px';
            document.body.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 7000);
        }
        setInterval(createParticle, 300);

        // Şifre Kontrolü
        function checkPassword() {
            const input = document.getElementById('password-input').value;
            if (input === '010410') {
                document.getElementById('password-card').classList.add('hidden');
                document.getElementById('main-card').classList.remove('hidden');
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        // Enter tuşuyla şifre girme
        document.getElementById('password-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // Kaçan Hayır Butonu Logic ve Mesajları
        const btnNo = document.getElementById('btn-no');
        const mainTitle = document.getElementById('main-title');
        
        // GÜNCELLENEN HAYIR MESAJLARI
        const noMessages = [
            "Ciddi misin? 🥺",
            "Ama nolur... 😭",
            "Yapma böyle... 💔",
            "Gerçekten mi? 😢",
            "Lütfen affet... 🙏"
        ];
        let messageIndex = 0;

        function moveButton() {
            const padding = 20;
            const maxX = window.innerWidth - btnNo.offsetWidth - padding;
            const maxY = window.innerHeight - btnNo.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            btnNo.style.position = 'fixed';
            btnNo.style.left = `${randomX}px`;
            btnNo.style.top = `${randomY}px`;

            // Mesajı değiştir
            btnNo.innerText = noMessages[messageIndex];
            messageIndex = (messageIndex + 1) % noMessages.length;
        }

        btnNo.addEventListener('mouseover', moveButton);
        btnNo.addEventListener('touchstart', function(e) {
            e.preventDefault();
            moveButton();
        });

        // Evet Butonuna Basıldığında
        function acceptApology() {
            document.getElementById('main-title').classList.add('hidden');
            document.getElementById('action-buttons').classList.add('hidden');
            document.getElementById('success-section').classList.remove('hidden');
            // Kaçan butonu ekrandan kaldır
            btnNo.style.display = 'none';
        }
    </script>
</body>
</html>
