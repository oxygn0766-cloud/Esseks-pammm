<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sana Bir Mesajım Var ✨</title>
    <style>
        /* Mobil Uyumlu Genel Düzen ve Mavi Tema */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #030712, #0a192f, #0f172a);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            color: #ffffff;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Arka Plandaki Elemanlar */
        .sky-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        /* Parlayan Sarı Yıldızlar */
        .star-yellow {
            position: absolute;
            background-color: #facc15;
            border-radius: 50%;
            box-shadow: 0 0 6px #fde047;
            opacity: 0.8;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* Yüzen Mavi Kalpler */
        .floating-blue-heart {
            position: absolute;
            color: #38bdf8;
            font-size: var(--size);
            opacity: 0.6;
            text-shadow: 0 0 8px #0284c7;
            animation: floatUp var(--duration) infinite linear;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Ana İçerik Konteyneri */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 400px;
        }

        /* Ortadaki Büyük Mavi Kalp */
        .main-heart-wrapper {
            cursor: pointer;
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-heart-wrapper:active {
            transform: scale(0.95);
        }

        .main-heart {
            font-size: 100px;
            color: #38bdf8;
            text-shadow: 0 0 20px #0284c7, 0 0 40px #38bdf8;
            animation: pulse 1.8s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px #38bdf8); }
            50% { transform: scale(1.12); filter: drop-shadow(0 0 30px #0284c7); }
        }

        .click-hint {
            margin-top: 15px;
            font-size: 16px;
            color: #94a3b8;
            letter-spacing: 1px;
            animation: fadeInOut 2s infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Mobil Şifre Modal Ekranı */
        .password-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #38bdf8;
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
            text-align: center;
            width: 85%;
            max-width: 320px;
            animation: popup 0.3s ease-out forwards;
        }

        .modal-content h3 {
            margin: 0 0 15px 0;
            color: #f8fafc;
            font-size: 19px;
        }

        .password-input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #1e293b;
            border-radius: 12px;
            background: #0f172a;
            color: #38bdf8;
            font-size: 24px;
            text-align: center;
            letter-spacing: 6px;
            outline: none;
            transition: border-color 0.3s;
        }

        .password-input:focus {
            border-color: #38bdf8;
        }

        .submit-btn {
            width: 100%;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: #f87171;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }

        /* Gizli Mesaj Kutusu */
        .message-box {
            display: none;
            width: 100%;
            padding: 25px 20px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #38bdf8;
            border-radius: 24px;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: popup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popup {
            from { opacity: 0; transform: scale(0.6); }
            to { opacity: 1; transform: scale(1); }
        }

        .message-text {
            font-size: 24px;
            font-weight: bold;
            color: #f8fafc;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            margin: 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Arka Plandaki Yıldızlar ve Mavi Kalpler -->
    <div class="sky-container" id="sky"></div>

    <!-- Ana İçerik -->
    <div class="container">
        <div class="main-heart-wrapper" id="heartButton">
            <div class="main-heart">🩵</div>
            <div class="click-hint" id="hint">Kalbe Dokun ✨</div>
        </div>

        <div class="message-box" id="messageBox">
            <p class="message-text">Seni çok seviyorum eşşek sıpam ❤️</p>
        </div>
    </div>

    <!-- Şifre Pop-up Ekranı -->
    <div class="password-modal" id="passwordModal">
        <div class="modal-content">
            <h3>Özel Şifreyi Gir ✨</h3>
            <input type="tel" id="passwordInput" class="password-input" maxlength="4" placeholder="••••">
            <button class="submit-btn" id="submitBtn">Aç</button>
            <div class="error-msg" id="errorMsg">Şifre yanlış! Tekrar dene 😜</div>
        </div>
    </div>

    <script>
        const skyContainer = document.getElementById('sky');

        // Arka plana 80 tane sarı parlayan yıldız ekle
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.classList.add('star-yellow');
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            const size = Math.random() * 3 + 1.5;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.setProperty('--duration', `${Math.random() * 3 + 1.5}s`);
            skyContainer.appendChild(star);
        }

        // Arka plana 18 tane yukarı doğru yüzen mavi kalp ekle
        for (let i = 0; i < 18; i++) {
            const heart = document.createElement('div');
            heart.classList.add('floating-blue-heart');
            heart.innerHTML = '🩵';
            heart.style.left = `${Math.random() * 100}%`;
            
            const size = Math.random() * 16 + 12; // 12px ile 28px arası
            const duration = Math.random() * 8 + 6; // 6s ile 14s arası yükseliş
            const delay = Math.random() * 5;

            heart.style.setProperty('--size', `${size}px`);
            heart.style.setProperty('--duration', `${duration}s`);
            heart.style.animationDelay = `${delay}s`;

            skyContainer.appendChild(heart);
        }

        // Eleman Tanımlamaları
        const heartButton = document.getElementById('heartButton');
        const passwordModal = document.getElementById('passwordModal');
        const passwordInput = document.getElementById('passwordInput');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        const messageBox = document.getElementById('messageBox');

        // Kalbe Dokununca Şifre Ekranını Aç
        heartButton.addEventListener('click', () => {
            if (messageBox.style.display !== 'block') {
                passwordModal.style.display = 'flex';
                passwordInput.focus();
            }
        });

        // Şifre Kontrolü (0766)
        function checkPassword() {
            const secretPass = "0766";
            if (passwordInput.value === secretPass) {
                passwordModal.style.display = 'none';
                heartButton.style.display = 'none'; // Butonu gizle
                messageBox.style.display = 'block'; // Mesajı göster
            } else {
                errorMsg.style.display = 'block';
                passwordInput.value = '';
            }
        }

        submitBtn.addEventListener('click', checkPassword);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
</body>
</html>
